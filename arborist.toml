# arborist.toml — settings for arborist.sh / chat.py
#
# Lines tagged  PERF  change speed or memory use. Defaults are tuned for an
# AMD RX 9070 (16 GB VRAM, RDNA4 / gfx1201) on Linux Mint.

[paths]
# Everything (source, build, weights, logs, chat history, memory) lives under
# here. A leading ~ is expanded.
root = "~/.local/share/arborist"

[build]
# PERF: GPU backend for the C++ build.
#   "vulkan" — Mesa RADV driver, no ROCm install needed. Community reports say
#              it's the less painful route on RDNA4. Default.
#   "hip"    — ROCm. Can be faster for prompt processing once it works, but
#              needs the ROCm toolkit (hipcc) installed and matching your kernel.
#   "cpu"    — fallback only; expect a few tokens/sec.
backend = "vulkan"

# PrismML's fork — stock llama.cpp can't run Bonsai 2 weights.
repo = "https://github.com/PrismML-Eng/llama.cpp.git"
# Branch, tag or commit. "prism" tracks their latest; pin a commit hash here
# once you find a build you're happy with.
ref = "prism"

# PERF: AMD GPU architecture for the HIP backend. RX 9070 / 9070 XT = gfx1201.
# Ignored for vulkan/cpu.
hip_target = "gfx1201"

# PERF: -march=native for the CPU code paths (AVX-512 on the 9800X3D).
# Only matters for layers you don't offload; leave on unless you copy the
# binary to another machine.
native = true

# Parallel compile jobs. 0 = all cores.
jobs = 0

[model]
# Shown in the chat banner and saved transcripts. Leave empty to use the file
# name.
name = "Bonsai 2 27B"

# Hugging Face repo and the .gguf file in it to download and serve. Point
# these at any GGUF model the llama.cpp build above can run.
repo = "prism-ml/Ternary-Bonsai-2-27B-gguf"
# PERF: for Bonsai 2 the packing is in the file name. Same weights either way.
#   Ternary-Bonsai-2-27B-PQ2_0.gguf  — 7.21 GB, faster prompt processing. PrismML's default.
#   Ternary-Bonsai-2-27B-PTQ1_0.gguf — 5.95 GB, frees ~1.3 GB of VRAM for context.
file = "Ternary-Bonsai-2-27B-PQ2_0.gguf"

# Reasoning efforts this model's chat template accepts; /effort and
# chat.reasoning_effort must use one of these. Leave empty ([]) for a model
# without effort control, and no effort is sent.
# Bonsai 2's template accepts only these three ("high" and "low" throw).
efforts = ["none", "medium", "xhigh"]

# PERF: vision projector (screenshots/images). Costs VRAM and load time;
# off by default since this setup is for code.
vision = false
mmproj_file = "Ternary-Bonsai-2-27B-mmproj-Q8_0.gguf"

[options]
# Optional llama-server flags that belong to this model rather than to your
# hardware, as one string (quote with "..." like a shell). Swap them out with
# the model. Placeholders: {efforts} = model.efforts joined with commas,
# {effort} = chat.reasoning_effort. Leave "" for none. (For flags that don't
# depend on the model, use server.extra_args.)
#
# Bonsai 2 (PrismML fork): the template throws on efforts it doesn't know, so
# restrict them, and map strays to the default instead of an HTTP 500.
server_args = "--reasoning-effort-allow {efforts} --reasoning-effort-fallback {effort}"

[server]
host = "127.0.0.1"   # keep on loopback; there's no auth
port = 8091

# PERF: layers on the GPU. 99 = all of them. The whole model fits in 16 GB,
# so lower this only if you hit out-of-memory.
gpu_layers = 99

# PERF: context window in tokens (max 262144). FP16 KV cache costs ~64 KiB per
# token: 65536 ≈ 4 GiB, which sits comfortably next to the 7.2 GB weights on a
# 16 GB card. Raise it if you paste whole repos; lower it if the desktop
# starts stuttering for VRAM.
ctx_size = 65536

# PERF: KV cache precision. "f16" is lossless. "q8_0" halves KV memory
# (doubles the context you can fit) with a small quality cost; needs flash
# attention on.
cache_type_k = "f16"
cache_type_v = "f16"

# PERF: flash attention. "on" is faster and needed for quantized KV. Set
# "auto" if your Vulkan driver misbehaves.
flash_attn = "on"

# PERF: one slot = one conversation gets the whole context. More slots split
# ctx_size between them.
parallel = 1

# PERF: prompt-processing batch sizes. A bigger ubatch usually speeds up
# reading long prompts on GPU at the cost of a little VRAM. 512 is safe;
# try 1024 if prompt processing feels slow.
batch_size = 2048
ubatch_size = 512

# CPU threads for whatever runs on CPU. 0 = let llama.cpp decide.
threads = 0

# Seconds to wait for the model to load before giving up.
startup_timeout = 300

# Anything else, passed straight through to llama-server.
extra_args = []

[chat]
system_prompt = "You are a helpful assistant and an expert software engineer. Be concise and precise."

# PERF: the biggest latency knob. Must be one of model.efforts (ignored if
# that's empty). For Bonsai 2, which thinks before it answers:
#   "medium" — thinks noticeably less, about as accurate. Default.
#   "xhigh"  — the model's own default; can think for many thousands of tokens.
#   "none"   — no thinking; fastest, weakest on hard problems.
reasoning_effort = "medium"

# Show the model's thinking (dimmed) as it streams. Display only.
show_thinking = false

# Output cap per reply, thinking included. Too small and replies stop mid-thought.
max_tokens = 16384

# Sampling. These are PrismML's recommended thinking-mode values.
temperature = 1.0
top_p = 0.95
top_k = 20
min_p = 0.05
presence_penalty = 0.0

# Print speed and token counts after each reply.
show_stats = true

# The system prompt tells the model the date and time (fixed at the start of
# each conversation, so the prompt cache holds), and, with tools on, the OS,
# shell, installed toolchains and git branch. These environment variables are
# shown too, when set. Names only; never list anything holding a secret.
env_vars = ["VIRTUAL_ENV", "CONDA_DEFAULT_ENV"]

[tools]
# Let the model read, search, edit and create files in the directory you start
# the chat from, and run single .py/.rs/.dart/.js/.ts files. /tools toggles
# this mid-chat.
enabled = true

# Edits and new files: "ask" shows a diff and waits for y/n/a (a = yes to all
# edits for the rest of the session); "auto" applies them without asking.
# Running code ALWAYS asks first; that isn't configurable.
approve_edits = "ask"

# Tool round-trips allowed per message before the model must wrap up.
max_steps = 25

# PERF: everything a tool returns stays in the context window. These caps stop
# one big file or search from eating it. ~4 characters per token.
max_read_lines = 400
max_output_chars = 20000
max_list_entries = 300
max_grep_matches = 100
# Deepest view_tree will expand (the model can ask for less).
max_tree_depth = 4

# Seconds a run (compile + execute) may take before it's killed.
run_timeout = 120
# Same for run_tests (a whole suite, including any compile).
test_timeout = 300

# Stuck detection. Small models rarely notice they're going in circles, so
# the harness pauses tool use and makes the model explain and ask you when:
#   - this many tool calls in a row fail, or
#   - the same call gets the same result this many times in one turn.
# 0 turns a check off.
max_consecutive_errors = 4
max_repeat_calls = 3

# Snapshot the workspace's files before the model first edits, writes or runs
# anything in a turn, so /undo can put them back (/checkpoints lists them).
# Uses a private git repository under paths.root; a project's own repo is
# never touched. Needs git.
checkpoints = true
# Checkpoints older than this many days are deleted when arborist starts, and
# a workspace's checkpoint store goes entirely once none are left or the
# workspace folder no longer exists. 0 keeps them forever.
checkpoint_days = 14

# Web: fetch_url reads one page; crawl_docs follows links under the same
# directory of a docs site. Every new page (and every crawl) asks you first,
# showing the URL and the model's reason. Private/LAN addresses are always
# refused, and once a page is in the conversation, edits ask again even in
# "auto" mode.
web_enabled = true
# Hosts that never ask. Convenient, but it reopens the leak the prompt closes:
# the model could put anything it has read into a URL on these hosts.
web_allowed_hosts = []          # e.g. ["docs.python.org", "doc.rust-lang.org"]

# PERF: characters of a page returned per fetch_url call (~4 chars/token).
web_page_chars = 12000
# Hard caps on a crawl, whatever the model asks for.
web_max_pages = 25
web_max_depth = 2
web_timeout = 15                # seconds per request

[compaction]
# Keeps long conversations inside server.ctx_size. Before each request, if it
# would pass `threshold` of the window, arborist shrinks it until it's under
# `target`: first old tool output becomes one-line stubs (the model re-reads
# a file if it needs it again), then turns older than the last `keep_turns`
# are replaced by a summary the model writes. /compact does it on demand.
enabled = true
threshold = 0.7
target = 0.5
# Your recent messages, the current one included, are never summarised.
keep_turns = 2
# The newest tool results are never stubbed in the first pass.
keep_tool_results = 8
# PERF: effort for writing the summary; "" uses the chat's current effort.
# Summarising doesn't need deep thinking, so the cheapest level is fine.
summary_effort = "none"
