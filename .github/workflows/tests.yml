name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # Toolchains for the run_file tests. Rust (rustc/cargo) is preinstalled
      # on GitHub's Ubuntu runners; tests for anything missing skip themselves.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: dart-lang/setup-dart@v1

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Show toolchains
        run: |
          python --version; node --version; rustc --version; cargo --version; dart --version

      # Runs are sandboxed with bubblewrap, which needs unprivileged user
      # namespaces. Ubuntu 24.04 restricts them through AppArmor; lift that on
      # the runner, then check bwrap really works before testing.
      - name: Install bubblewrap
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q bubblewrap
          bwrap --version
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --ro-bind /usr /usr --symlink usr/bin /bin --symlink usr/lib /lib \
                --symlink usr/lib64 /lib64 --proc /proc --dev /dev --unshare-all /usr/bin/true \
            || { echo "::error title=bwrap::bwrap can't create a sandbox on this runner"; exit 1; }

      # ARBORIST_REQUIRE_SANDBOX: the sandbox and audit tests fail instead of
      # skipping if the sandbox doesn't work here.
      - name: Run tests
        env:
          ARBORIST_REQUIRE_SANDBOX: "1"
        run: python -m pytest -v --junitxml=pytest-results.xml

      # One annotation per failing test, so failures show on the PR page
      # without opening the log.
      - name: Annotate failures
        if: failure()
        run: |
          python - <<'EOF'
          import os, xml.etree.ElementTree as ET
          if not os.path.exists("pytest-results.xml"):
              raise SystemExit(0)  # failed before the tests ran; the step log says why
          for case in ET.parse("pytest-results.xml").iter("testcase"):
              for bad in list(case.iter("failure")) + list(case.iter("error")):
                  text = ((bad.get("message") or "") + "\n" + (bad.text or ""))[-3000:]
                  text = text.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
                  print(f"::error title={case.get('classname')}.{case.get('name')}::{text}")
          EOF

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint arborist.sh
        run: shellcheck -S warning arborist.sh
